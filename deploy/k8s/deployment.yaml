apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: scout
  labels:
    app.kubernetes.io/name: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scout
          image: ghcr.io/zyvorai/scout:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --file
            - /data/inventory.json
            - --addr
            - ":18447"
          ports:
            - name: http
              containerPort: 18447
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: inventory
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: inventory
          configMap:
            name: scout-inventory
        - name: tmp
          emptyDir: {}
