apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scout
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
# Uncomment to expose via Ingress (TLS + basic auth required):
#  - ingress.yaml
images:
  - name: ghcr.io/zyvorai/scout
    newTag: "0.1.0"
labels:
  - pairs:
      app.kubernetes.io/part-of: scout
    includeSelectors: false
